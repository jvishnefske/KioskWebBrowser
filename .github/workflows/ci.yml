name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository-1.0-dev \
            gir1.2-webkit2-4.1 \
            libcairo2-dev \
            pkg-config \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            python3-pytest \
            python3-pytest-cov \
            python3-flake8

      - name: Install Python dependencies
        run: |
          # Use system python packages for GTK/GI, install remaining with pip
          python -m pip install --upgrade pip
          pip install pytest pytest-cov flake8 || true

      - name: Run linter
        run: make lint

      - name: Run tests with coverage
        run: make coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 30
